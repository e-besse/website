<style>
:root{--ink:#2b2640;--muted:#6b6784;--lilac:#cdbdf0;--lilac2:#ece6fa;--blue:#bfdaf3;--blue2:#e4f0fb;

html{scroll-padding-top:4.5rem}

body{margin:0;font:18px/1.65 var(--body);color:var(--ink);background:#fff}
h1,h2,h3,.gs{font-family:var(--head);font-weight:700;text-transform:lowercase;letter-spacing:-.01em;line-height:1.1;margin:0}

header{position:sticky;top:0;z-index:5;background:#fffffff0;border-bottom:1px solid var(--lilac2);display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.6rem;padding:.8rem 1.5rem}

header nav a{font-size:.95rem;text-decoration:none}

.lang button{font:700 .9rem var(--head);background:none;border:0;padding:.2rem .5rem;cursor:pointer;color:var(--muted)}

section{max-width:1000px;margin:auto;padding:3.5rem 1.5rem 1rem}

.item.sm{padding:.9rem 0}
.item h3{font-size:1.5rem}

.yr{font-family:var(--head);font-weight:700;color:var(--muted)}
.meta{color:var(--muted);margin:.3rem 0 .8rem}
.item p{margin:.5rem 0;max-width:62ch}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,220px));gap:1rem .75rem;margin:1.2rem 0;align-items:start}
.ph.pending{visibility:hidden}
.ph.book{grid-template-columns:minmax(140px,200px)}
.ph .newrow{grid-column-start:1}
.ph figure{margin:0}
.thumb{display:block;position:relative;width:100%;padding:0;border:0;background:var(--lilac2);cursor:zoom-in}
.ph:not(.book) .thumb{aspect-ratio:1/1}
.thumb img,.thumb video{display:block;width:100%;height:100%;object-fit:cover}
.ph.book .thumb img{height:auto}
.thumb:hover,.thumb:focus-visible{outline:3px solid var(--lilac);outline-offset:0}
.thumb.v::after{content:"▶";position:absolute;inset:0;margin:auto;width:3rem;height:3rem;display:grid;place-items:center;background:var(--lilac);color:var(--ink)}
.ph figcaption{font-size:.8rem;line-height:1.4;color:var(--muted);margin-top:.35rem}
.slot{aspect-ratio:1/1;background:var(--lilac2);display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.ph.book .slot{aspect-ratio:2/3}
.ph figure:nth-child(even) .slot{background:var(--blue2)}
#lb{position:fixed;inset:0;z-index:20;background:#fffffffa;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3.5rem 1rem 1rem}
#lb[hidden]{display:none}
#lb .stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#lb img,#lb video{max-width:100%;max-height:calc(100vh - 9rem);display:block}
#lb .cap{font-size:.9rem;color:var(--muted);margin:.8rem 0 0;max-width:70ch;text-align:center;min-height:1.4em}
#lb button{position:absolute;width:2.8rem;height:2.8rem;border:0;background:var(--lilac);color:var(--ink);font:700 1.6rem/1 var(--head);cursor:pointer}
#lb button:hover{background:var(--blue)}
#lb .x{top:.8rem;right:.8rem}
#lb .pv,#lb .nx{top:50%;transform:translateY(-50%)}
#lb .pv{left:.8rem}#lb .nx{right:.8rem}
#lb.one .pv,#lb.one .nx{display:none}
.portrait{float:right;width:min(260px,40%);height:auto;margin:0 0 1rem 2rem}
.bio h3{clear:both}
.rel{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.3rem}
.card{display:block;background:var(--blue2);border-left:4px solid var(--blue);padding:.7rem 1rem;text-decoration:none;min-width:200px;max-width:340px}
.card:hover,.card:focus-visible{background:var(--lilac2);border-color:var(--lilac)}
.card small{display:block;color:var(--muted);font-size:.85rem}
.card b{font:700 1.05rem/1.2 var(--head);text-transform:lowercase}
.soon{display:inline-block;background:var(--lilac);padding:0 .6rem;margin-top:.5rem;font:700 .9rem/1.6 var(--head);text-transform:lowercase}
.bio p{max-width:62ch}
.bio h3{margin:2.2rem 0 .4rem;font-size:1.3rem}
footer{max-width:1000px;margin:3rem auto 0;padding:2rem 1.5rem 4rem;border-top:1px solid var(--lilac2)}
footer p{margin:.2rem 0}
@media(max-width:640px){body{font-size:17px}.item{grid-template-columns:1fr;gap:.2rem}.hero{padding-top:4rem}}
</style>

/* portraits first, landscapes below; every gallery revealed once sorted */
function arrange(){
 document.querySelectorAll(".ph").forEach(g=>{
  const done=()=>g.classList.remove("pending");setTimeout(done,4000);
  if(g.classList.contains("book"))return done();
  const figs=[...g.children],media=f=>f.querySelector("img,video");
  Promise.all(figs.map(f=>new Promise(res=>{const m=media(f);if(!m)return res();
   if(m.tagName==="IMG"){m.complete&&m.naturalWidth?res():(m.onload=m.onerror=res)}
   else{m.readyState>=1?res():(m.onloadedmetadata=m.onerror=res)}}))).then(()=>{
   const land=f=>{const m=media(f);return m&&(m.naturalWidth||m.videoWidth)>(m.naturalHeight||m.videoHeight)?1:0};
   const sorted=figs.map((f,i)=>[f,land(f),i]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(x=>x[0]);
   sorted.forEach(f=>g.appendChild(f));
   const first=sorted.find(land);if(first)first.classList.add("newrow");
  }).finally(done);
 });
}
/* click-to-enlarge viewer (photos and videos) */
const lb=document.createElement("div");lb.id="lb";lb.hidden=true;lb.setAttribute("role","dialog");lb.setAttribute("aria-modal","true");
lb.innerHTML='<button class="x" type="button">×</button><button class="pv" type="button">‹</button><button class="nx" type="button">›</button><div class="stage"></div><p class="cap"></p>';
document.body.appendChild(lb);
let figs=[],cur=0,opener=null;
function show(i){
 cur=(i+figs.length)%figs.length;const f=figs[cur],src=f.dataset.src,im=f.querySelector("img");
 lb.querySelector(".stage").innerHTML=f.dataset.v?`<video controls autoplay playsinline src="${src}"></video>`:`<img src="${src}" alt="${im?im.alt:""}">`;
 const c=f.querySelector("figcaption");lb.querySelector(".cap").textContent=c?c.textContent:"";
 lb.classList.toggle("one",figs.length<2);
}
function openLB(f){
 figs=[...f.parentElement.querySelectorAll("figure[data-src]")];opener=document.activeElement;
 lb.querySelector(".x").setAttribute("aria-label",t(ui.close));
 lb.hidden=false;document.body.style.overflow="hidden";show(figs.indexOf(f));lb.querySelector(".x").focus();
}
function closeLB(){lb.hidden=true;lb.querySelector(".stage").innerHTML="";document.body.style.overflow="";if(opener)opener.focus()}
document.addEventListener("click",e=>{
 const b=e.target.closest(".thumb");if(b&&b.closest("figure[data-src]"))return openLB(b.closest("figure"));
 if(lb.hidden)return;
 if(e.target.closest(".x")||e.target===lb||e.target.classList.contains("stage"))closeLB();
 else if(e.target.closest(".pv"))show(cur-1);else if(e.target.closest(".nx"))show(cur+1);
});
document.addEventListener("keydown",e=>{
 if(lb.hidden)return;
 if(e.key==="Escape")closeLB();
 else if(e.target.tagName!=="VIDEO"&&e.key==="ArrowLeft")show(cur-1);
 else if(e.target.tagName!=="VIDEO"&&e.key==="ArrowRight")show(cur+1);
});
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}render()}
render();
if(location.hash){const e=document.getElementById(location.hash.slice(1));e&&e.scrollIntoView()}
</script>
</body>
</html>
